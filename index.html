<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directorio Ecco Qualitá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #107782;
    --teal-claro: #16a5b4;
    --teal-oscuro: #0a4950;
    --titulos: #0b3130;
    --dorado: #fec565;
    --dorado-oscuro: #feb02d;
    --texto: #646464;
    --fondo: #f6f5ef;
    --blanco: #ffffff;
    --borde: #e6e4da;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Ubuntu", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--texto);
    background: var(--fondo);
  }

  h1, h2 { font-family: "DM Sans", sans-serif; font-weight: 700; line-height: 1.2; margin: 0; }

  .contenedor { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

  /* Encabezado */
  header {
    background: var(--blanco);
    box-shadow: 0 2px 12px rgba(11, 49, 48, .08);
    position: sticky; top: 0; z-index: 10;
  }
  header .contenedor { display: flex; align-items: center; justify-content: space-between; height: 72px; }
  .logo img { height: 40px; display: block; }
  .logo span { font-family: "DM Sans", sans-serif; font-weight: 700; font-size: 22px; color: var(--teal); }
  .etiqueta {
    font-size: 12px; font-weight: 500; letter-spacing: .6px; text-transform: uppercase;
    color: var(--teal);
  }

  /* Portada */
  .portada {
    background: linear-gradient(135deg, var(--teal-oscuro), var(--teal));
    color: var(--blanco);
    padding: 56px 0 84px;
    text-align: center;
  }
  .portada .etiqueta { color: var(--dorado); }
  .portada h1 { font-size: clamp(30px, 5vw, 44px); margin: 8px 0 10px; text-wrap: balance; }
  .portada p { margin: 0 auto; max-width: 560px; color: rgba(255, 255, 255, .85); }
  .volver {
    display: none; margin-bottom: 14px;
    font-size: 13px; font-weight: 500; color: var(--blanco); text-decoration: none;
    padding: 6px 16px; border: 1px solid rgba(255, 255, 255, .4); border-radius: 48px;
  }
  .volver:hover { background: rgba(255, 255, 255, .12); }
  .en-espacio .volver { display: inline-block; }

  .buscador { max-width: 560px; margin: -28px auto 0; position: relative; }
  .buscador input {
    width: 100%; height: 56px;
    padding: 0 24px 0 54px;
    border: 1px solid var(--borde); border-radius: 48px;
    font: inherit; color: var(--titulos);
    background: var(--blanco);
    box-shadow: 0 10px 30px rgba(11, 49, 48, .12);
    outline: none;
  }
  .buscador input:focus { border-color: var(--teal); }
  .buscador svg { position: absolute; left: 20px; top: 18px; width: 20px; height: 20px; stroke: var(--teal); }

  /* Secciones */
  main { padding: 48px 0 64px; }
  section { margin-bottom: 44px; }
  .cabecera { margin-bottom: 18px; }
  .cabecera h2 { font-size: 26px; color: var(--titulos); }
  .cabecera h2::after {
    content: ""; display: block; width: 44px; height: 4px; border-radius: 4px;
    background: var(--dorado); margin-top: 10px;
  }

  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }

  .tarjeta {
    display: flex; flex-direction: column; gap: 10px;
    padding: 22px;
    background: var(--blanco);
    border: 1px solid var(--borde); border-radius: 16px;
    text-decoration: none; color: inherit;
    transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  a.tarjeta:hover, a.tarjeta:focus-visible {
    transform: translateY(-4px);
    border-color: var(--teal);
    box-shadow: 0 14px 30px rgba(16, 119, 130, .16);
    outline: none;
  }
  .icono {
    width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center;
    background: rgba(16, 119, 130, .1);
    transition: background .2s;
  }
  .icono svg { width: 24px; height: 24px; stroke: var(--teal); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s; }
  a.tarjeta:hover .icono { background: var(--teal); }
  a.tarjeta:hover .icono svg { stroke: var(--blanco); }

  /* Logos oficiales de Microsoft: van sin fondo de color y no cambian al pasar el cursor */
  .icono.logo, a.tarjeta:hover .icono.logo { background: var(--blanco); border: 1px solid var(--borde); }
  .icono.logo img { width: 28px; height: 28px; display: block; }
  .tarjeta.pendiente .icono.logo { background: transparent; }
  .tarjeta.pendiente .icono.logo img { filter: grayscale(1); opacity: .55; }
  /* Logo propio de un cliente (campo "logo" en enlaces.js): ocupa todo el recuadro */
  .icono.logo.propio { overflow: hidden; }
  .icono.logo.propio img { width: 100%; height: 100%; object-fit: contain; }

  .tarjeta strong { font-family: "DM Sans", sans-serif; font-size: 18px; color: var(--titulos); }
  .tarjeta p { margin: 0; font-size: 14px; line-height: 1.5; flex: 1; }
  .origen { font-size: 12px; font-weight: 500; color: var(--teal); margin-bottom: -6px; }
  .abrir { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--teal); }
  .estado {
    align-self: flex-start; padding: 5px 9px; border-radius: 48px;
    font-size: 11px; font-weight: 700; line-height: 1; letter-spacing: .4px;
    text-transform: uppercase;
  }
  .estado-activo { color: var(--blanco); background: var(--teal-oscuro); }
  .estado-cerrado { color: var(--texto); background: var(--fondo); border: 1px solid var(--borde); }

  .tarjeta.pendiente { border-style: dashed; background: transparent; cursor: not-allowed; }
  .tarjeta.pendiente .icono { background: rgba(0, 0, 0, .05); }
  .tarjeta.pendiente .icono svg { stroke: #9a9a9a; }
  .tarjeta.pendiente strong { color: var(--texto); }
  .tarjeta.pendiente .abrir { color: #8a6a1c; }

  .vacio { text-align: center; padding: 40px 0; display: none; }

  footer { background: var(--titulos); color: rgba(255, 255, 255, .7); font-size: 14px; padding: 24px 0; text-align: center; }
  footer a { color: var(--dorado); text-decoration: none; }

  /* Inicio de sesión con Microsoft 365 */
  .sesion { display: flex; align-items: center; gap: 12px; }
  .sesion .quien { font-size: 13px; color: var(--texto); }
  .sesion .cerrar { font-size: 12px; font-weight: 500; color: var(--teal); text-decoration: none; }
  .sesion .cerrar:hover { text-decoration: underline; }

  .login-pantalla {
    display: none; min-height: calc(100vh - 72px);
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--teal-oscuro), var(--teal));
    padding: 24px;
  }
  .login-tarjeta {
    background: var(--blanco); border-radius: 16px; padding: 40px 32px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 20px 50px rgba(11, 49, 48, .25);
  }
  .login-tarjeta h1 { font-size: 22px; color: var(--titulos); margin-bottom: 8px; }
  .login-tarjeta p { font-size: 14px; margin: 0 0 24px; }
  .btn-microsoft {
    display: inline-flex; align-items: center; gap: 12px; justify-content: center;
    width: 100%; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--borde);
    background: var(--blanco); font: inherit; font-size: 15px; font-weight: 500;
    color: var(--titulos); cursor: pointer;
  }
  .btn-microsoft:hover { background: var(--fondo); }
  .login-error { color: #b42318; font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>

<header>
  <div class="contenedor">
    <a class="logo" href="https://eccoqualita.com/" target="_blank" rel="noopener">
      <img src="https://eccoqualita.com/wp-content/uploads/2025/09/Asset-1.svg" alt="Ecco Qualitá"
           onerror="this.outerHTML='<span>Ecco Qualitá</span>'">
    </a>
    <span class="etiqueta" id="sesion">Directorio interno</span>
  </div>
</header>

<div class="login-pantalla" id="login">
  <div class="login-tarjeta">
    <h1>Directorio Ecco Qualitá</h1>
    <p>Inicia sesión con tu cuenta de Microsoft 365 de Ecco Qualitá para ver los accesos de tu área.</p>
    <button class="btn-microsoft" id="btn-login" type="button">Iniciar sesión con Microsoft</button>
    <p class="login-error" id="login-error" style="display:none"></p>
  </div>
</div>

<div id="app">
<div class="portada">
  <div class="contenedor" id="portada">
    <div><a class="volver" href="#/">← Volver al inicio</a></div>
    <span class="etiqueta" id="portada-etiqueta"></span>
    <h1 id="portada-titulo"></h1>
    <p id="portada-texto"></p>
  </div>
</div>

<div class="contenedor">
  <div class="buscador">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="buscar" type="search" placeholder="Buscar una herramienta…" aria-label="Buscar una herramienta" autofocus>
  </div>
</div>

<main class="contenedor">
  <div id="secciones"></div>
  <p class="vacio" id="vacio">No encontramos ninguna herramienta con ese nombre.</p>
</main>
</div>

<footer>
  <div class="contenedor">
    © <span id="anio"></span> Ecco Qualitá · ¿Falta un acceso? Escribe a <a href="mailto:info@eccoqualita.com">info@eccoqualita.com</a>
  </div>
</footer>

<script src="enlaces.js"></script>
<script>
  const ICONOS = {
    erp: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 13v-2M12 13V8M17 13v-4"/>',
    sharepoint: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    proyectos: '<path d="M4 4v16h16"/><path d="M8 8h7M10 12h8M8 16h5"/>',
    comercial: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    personas: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>',
    calidad: '<circle cx="12" cy="9" r="6"/><path d="m9.5 9 1.8 1.8L14.5 7.5"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/>',
    planner: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 2v4M15 2v4M8 12l2 2 4-4M8 17h8"/>',
    correo: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    teams: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-5A8 8 0 1 1 21 12z"/>',
    nube: '<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.5 4.3 4.3 0 0 1 17.5 18z"/>',
    web: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    enlace: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  };

  Object.assign(ICONOS, {
    gobierno: '<path d="M12 3 4 6v5c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/>',
    libro: '<path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/>',
    portafolio: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
    archivo: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M9.5 14l2 2 3.5-3.5"/>',
    idea: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.900c.6.5 1 1.3 1 2.100h5c0-.8.4-1.6 1-2.100A6 6 0 0 0 12 3z"/>',
    engranaje: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.600l2.1 2.100M16.3 16.300l2.1 2.100M5.6 18.400l2.1-2.100M16.3 7.700l2.1-2.1"/>',
    objetivo: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    megafono: '<path d="M4 10v4h3l7 4V6l-7 4zM17.5 9a4 4 0 0 1 0 6M8 14v4a1 1 0 0 0 1 1h1.5"/>',
    academia: '<path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11.5V16c1.5 1.5 3.5 2.5 6 2.5s4.5-1 6-2.5v-4.5M22 9v6"/>',
    finanzas: '<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.8 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>',
    herramienta: '<path d="M15 5a4 4 0 0 0-4.6 5.4L4 17l3 3 6.6-6.4A4 4 0 0 0 19 9l-2.5 2.5-2-2L17 7a4 4 0 0 0-2-2z"/>',
    balanza: '<path d="M12 4v16M7 20h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/>',
    candado: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    cliente: '<path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4"/>',
  });

  // Áreas y clientes comparten formato: cada uno es un "espacio" con su propia página
  const ESPACIOS = [
    ...AREAS.map(a => ({ ...a, tipo: "Área" })),
    ...CLIENTES.map(c => ({ icono: "cliente", ...c, tipo: "Cliente" })),
  ];
  const enlacesDe = espacio => espacio.grupos.flatMap(g => g.enlaces);

  // --- Inicio de sesión con Microsoft 365 y accesos por rol -----------------
  // Mientras AUTH.activo sea false, el hub funciona exactamente igual que
  // hasta ahora: sin inicio de sesión y visible para cualquiera. Un
  // administrador de TI debe registrar la aplicación en el Microsoft Entra
  // ID (Azure AD) de Ecco Qualitá y entregar los dos datos de abajo; recién
  // entonces se cambia "activo" a true. Ver CONFIGURAR-INICIO-DE-SESION.md.
  const AUTH = {
    activo: false,          // true cuando ya estén cargados clientId y tenantId reales
    clientId: "",           // "Application (client) ID" del registro de la app
    tenantId: "",           // "Directory (tenant) ID" del registro de la app
    rolAdmin: "admin",      // valor del "App role" que da acceso a todas las áreas
  };

  // El rol de cada área es su propio "id" (por ejemplo "pmo", "comercial").
  // Los clientes se ven junto con el PMO, así que siguen el rol "pmo".
  let MIS_ROLES = [];
  const puedeVer = id => !AUTH.activo || MIS_ROLES.includes(AUTH.rolAdmin) || MIS_ROLES.includes(id);
  const rolDe = espacio => espacio.tipo === "Cliente" ? "pmo" : espacio.id;
  const mensajeSinAcceso = () => `<p class="vacio" style="display:block">
    No tienes acceso a esta área. Si crees que deberías tenerlo, pide a tu administrador
    que te asigne el rol correspondiente en el directorio.</p>`;

  const contenedor = document.getElementById("secciones");
  const buscar = document.getElementById("buscar");
  const normalizar = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  // Logos oficiales de cada producto, servidos desde los servidores de su fabricante.
  // Si uno no carga, la tarjeta muestra el icono de trazo de ICONOS.
  const MARCAS = "https://static2.sharepointonline.com/files/fabric/assets/brand-icons/product/svg/";
  const LOGOS = {
    sharepoint: MARCAS + "sharepoint_48x1.svg",
    correo: MARCAS + "outlook_48x1.svg",
    teams: MARCAS + "teams_48x1.svg",
    nube: MARCAS + "onedrive_48x1.svg",
    planner: "https://planner.cloud.microsoft/favicon.ico",
    hubspot: "https://www.hubspot.com/favicon.ico",
    eccoqualita: "https://eccoqualita.com/wp-content/uploads/2025/09/cropped-fqvicon-192x192.png",
  };
  const trazo = nombre => `<svg viewBox="0 0 24 24">${ICONOS[nombre] || ICONOS.enlace}</svg>`;
  const icono = nombre => LOGOS[nombre]
    ? `<span class="icono logo"><img src="${LOGOS[nombre]}" alt="" data-icono="${nombre}"></span>`
    : `<span class="icono">${trazo(nombre)}</span>`;

  // Todo enlace que lleva a Planner o a SharePoint usa el logo de ese producto,
  // sin importar el icono que tenga puesto en enlaces.js
  const iconoDeEnlace = enlace =>
    /planner\.cloud\.microsoft|tasks\.office\.com/.test(enlace.url) ? "planner"
    : /sharepoint\.com/.test(enlace.url) ? "sharepoint"
    : /hubspot\.com/.test(enlace.url) ? "hubspot"
    : enlace.icono;

  function tarjetaEnlace(enlace, origen) {
    const esInterno = enlace.url.startsWith("#/");
    const etiqueta = enlace.url
      ? `a href="${enlace.url}"${esInterno ? "" : ' target="_blank" rel="noopener"'}`
      : "div";
    const accion = esInterno ? "Ver proyectos →" : enlace.url ? "Abrir →" : "Enlace pendiente";
    return `
      <${etiqueta} class="tarjeta${enlace.url ? "" : " pendiente"}">
        ${icono(iconoDeEnlace(enlace))}
        ${origen ? `<span class="origen">${origen}</span>` : ""}
        <strong>${enlace.nombre}</strong>
        <p>${enlace.descripcion}</p>
        <span class="abrir">${accion}</span>
      </${enlace.url ? "a" : "div"}>`;
  }

  function resumenAccesos(espacio) {
    const enlaces = enlacesDe(espacio);
    if (!enlaces.length) return "Sin accesos todavía →";

    const disponibles = enlaces.filter(enlace => enlace.url).length;
    const pendientes = enlaces.length - disponibles;
    const partes = [];
    if (disponibles) partes.push(`${disponibles} ${disponibles === 1 ? "disponible" : "disponibles"}`);
    if (pendientes) partes.push(`${pendientes} ${pendientes === 1 ? "pendiente" : "pendientes"}`);
    return `${partes.join(" · ")} →`;
  }

  function etiquetaEstado(espacio) {
    if (espacio.tipo !== "Cliente") return "";
    const estado = espacio.estado === "cerrado" ? "Cerrado" : "Activo";
    return `<span class="estado estado-${espacio.estado}">${estado}</span>`;
  }

  function tarjetaEspacio(espacio) {
    return `
      <a class="tarjeta" href="#/${espacio.id}">
        ${espacio.logo
          ? `<span class="icono logo propio"><img src="${espacio.logo}" alt="" data-icono="${espacio.icono}"></span>`
          : icono(espacio.icono)}
        ${etiquetaEstado(espacio)}
        <strong>${espacio.nombre}</strong>
        <p>${espacio.descripcion}</p>
        <span class="abrir">${resumenAccesos(espacio)}</span>
      </a>`;
  }

  const seccion = (subtitulo, titulo, tarjetas) => `
    <section>
      <div class="cabecera">
        <span class="etiqueta">${subtitulo}</span>
        <h2>${titulo}</h2>
      </div>
      <div class="rejilla">${tarjetas.join("")}</div>
    </section>`;

  function portada(etiqueta, titulo, texto, enEspacio) {
    document.getElementById("portada-etiqueta").textContent = etiqueta;
    document.getElementById("portada-titulo").textContent = titulo;
    document.getElementById("portada-texto").textContent = texto;
    document.getElementById("portada").classList.toggle("en-espacio", enEspacio);
  }

  function mostrar() {
    const q = normalizar(buscar.value.trim());
    const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    const espacio = ESPACIOS.find(e => e.id === id);
    const esPaginaCerrados = id === "proyectos-cerrados";
    const volver = document.querySelector(".volver");
    let html;

    if (espacio) {
      const etiquetaPortada = espacio.tipo === "Cliente" ? `Cliente ${espacio.estado}` : espacio.tipo;
      portada(etiquetaPortada, espacio.nombre, espacio.descripcion, true);
      // Los clientes activos vuelven al PMO; los cerrados, a su listado separado.
      const padre = espacio.tipo === "Cliente" && AREAS.find(a => a.proyectosDeClientes);
      const regresoCerrados = espacio.tipo === "Cliente" && espacio.estado === "cerrado";
      volver.href = regresoCerrados ? "#/proyectos-cerrados" : padre ? `#/${padre.id}` : "#/";
      volver.textContent = regresoCerrados ? "← Volver a Proyectos Cerrados"
        : padre ? `← Volver a ${padre.nombre}` : "← Volver al inicio";
    } else if (esPaginaCerrados) {
      portada("Gestión de Proyectos (PMO)", "Proyectos Cerrados",
        "Consulta los accesos de los proyectos finalizados.", true);
      volver.href = "#/pmo";
      volver.textContent = "← Volver a Gestión de Proyectos (PMO)";
    } else {
      portada("Hub de herramientas", "Todo lo que usamos, en un solo lugar",
        "Accesos por área, según el mapa de procesos, y a las herramientas de todo el equipo.", false);
    }

    if (q) {
      // La búsqueda siempre recorre todo el hub, sin importar la página actual,
      // pero solo entre lo que el usuario tiene permiso de ver.
      const coincide = (...textos) => normalizar(textos.join(" ")).includes(q);
      const visibles = ESPACIOS.filter(e => puedeVer(rolDe(e)));
      const tarjetas = [
        ...visibles.filter(e => coincide(e.nombre, e.descripcion)).map(tarjetaEspacio),
        ...visibles.flatMap(e => enlacesDe(e)
          .filter(l => coincide(l.nombre, l.descripcion, e.nombre))
          .map(l => tarjetaEnlace(l, e.nombre))),
        ...GENERALES.filter(l => coincide(l.nombre, l.descripcion)).map(l => tarjetaEnlace(l)),
      ];
      html = tarjetas.length ? seccion("Búsqueda", "Resultados", tarjetas) : "";
      document.getElementById("vacio").style.display = tarjetas.length ? "none" : "block";
    } else {
      document.getElementById("vacio").style.display = "none";
      if (esPaginaCerrados) {
        html = puedeVer("pmo")
          ? seccion("Gestión de Proyectos (PMO)", "Clientes con proyectos finalizados",
              ESPACIOS.filter(e => e.tipo === "Cliente" && e.estado === "cerrado").map(tarjetaEspacio))
          : mensajeSinAcceso();
      } else if (espacio) {
        if (!puedeVer(rolDe(espacio))) {
          html = mensajeSinAcceso();
        } else {
          const grupos = espacio.grupos.map(g => seccion(espacio.nombre, g.titulo, g.enlaces.map(l => tarjetaEnlace(l))));
          if (espacio.proyectosDeClientes) {
            grupos.splice(1, 0, seccion(espacio.nombre, "Proyectos Activos",
              ESPACIOS.filter(e => e.tipo === "Cliente" && e.estado !== "cerrado").map(tarjetaEspacio)));
          }
          html = grupos.join("") || `<p class="vacio" style="display:block">Todavía no hay accesos cargados para esta área.</p>`;
        }
      } else {
        html =
          PROCESOS.map(p => {
            const tarjetas = ESPACIOS.filter(e => e.proceso === p.id && puedeVer(e.id)).map(tarjetaEspacio);
            return tarjetas.length ? seccion("Mapa de procesos", p.titulo, tarjetas) : "";
          }).join("") +
          seccion("Para todo el equipo", "Herramientas generales", GENERALES.map(l => tarjetaEnlace(l)));
      }
    }
    contenedor.innerHTML = html;
    for (const img of contenedor.querySelectorAll(".logo img")) {
      img.onerror = () => {
        img.parentElement.classList.remove("logo");
        img.outerHTML = trazo(img.dataset.icono);
      };
    }
  }

  buscar.addEventListener("input", mostrar);
  window.addEventListener("hashchange", () => {
    buscar.value = "";
    mostrar();
    window.scrollTo(0, 0);
  });

  // Carga la librería de Microsoft (MSAL) solo si el inicio de sesión está activo;
  // mientras AUTH.activo sea false, el sitio no depende de ningún servidor externo.
  function cargarMsal() {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js";
      s.onload = resolve;
      s.onerror = () => reject(new Error("No se pudo cargar la librería de inicio de sesión."));
      document.head.appendChild(s);
    });
  }

  function mostrarErrorLogin(texto) {
    const error = document.getElementById("login-error");
    error.textContent = texto;
    error.style.display = "block";
  }

  async function iniciarSesion() {
    if (!AUTH.activo) { mostrar(); return; }

    document.getElementById("app").style.display = "none";
    const login = document.getElementById("login");
    const boton = document.getElementById("btn-login");

    let msalApp;
    try {
      await cargarMsal();
      msalApp = new msal.PublicClientApplication({
        auth: {
          clientId: AUTH.clientId,
          authority: `https://login.microsoftonline.com/${AUTH.tenantId}`,
          redirectUri: window.location.origin + window.location.pathname,
        },
        cache: { cacheLocation: "sessionStorage" },
      });
      await msalApp.initialize();
    } catch (error) {
      login.style.display = "flex";
      mostrarErrorLogin("No se pudo preparar el inicio de sesión. Intenta recargar la página.");
      return;
    }

    let cuenta;
    try {
      const resultado = await msalApp.handleRedirectPromise();
      cuenta = resultado?.account || msalApp.getAllAccounts()[0];
    } catch (error) {
      login.style.display = "flex";
      mostrarErrorLogin("No se pudo completar el inicio de sesión. Intenta de nuevo.");
      boton.onclick = () => msalApp.loginRedirect({ scopes: ["User.Read"] });
      return;
    }

    if (!cuenta) {
      login.style.display = "flex";
      boton.onclick = () => msalApp.loginRedirect({ scopes: ["User.Read"] });
      return;
    }

    msalApp.setActiveAccount(cuenta);
    MIS_ROLES = cuenta.idTokenClaims?.roles || [];

    login.style.display = "none";
    document.getElementById("app").style.display = "";
    document.getElementById("sesion").innerHTML = `
      <span class="sesion">
        <span class="quien">${cuenta.name || cuenta.username}</span>
        <a href="#" class="cerrar" id="cerrar-sesion">Cerrar sesión</a>
      </span>`;
    document.getElementById("cerrar-sesion").addEventListener("click", e => {
      e.preventDefault();
      msalApp.logoutRedirect();
    });

    mostrar();
    if (MIS_ROLES.length === 0) {
      contenedor.innerHTML = `<p class="vacio" style="display:block">
        Tu cuenta inició sesión correctamente, pero todavía no tiene ningún área asignada.
        Pide a tu administrador que te asigne un rol en el directorio.</p>`;
    }
  }

  iniciarSesion();

  document.getElementById("anio").textContent = new Date().getFullYear();
</script>
